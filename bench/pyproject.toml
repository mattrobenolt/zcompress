[project]
name = "zcompress-bench"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["boto3>=1.40", "click>=8.2", "rich>=14", "pydantic>=2"]

[project.scripts]
bench = "ec2bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ec2bench", "zcompress_bench"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "ty>=0.0.20"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", "CPY001", "COM812", "TC001", "TC002", "TC003",
  "S603", "S607", "TRY003", "EM101", "EM102", "PLR2004",
  "FBT001", "FBT002", "PLR0913", "ANN401", "PLC0415",
]

[tool.ty.environment]
python-version = "3.14"
